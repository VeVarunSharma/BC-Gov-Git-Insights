name: git-insights-local

# Local backing services for the collector, scanner, and synthesizer jobs.
# Ports are deliberately non-default so this stack cannot collide with other
# Postgres or Azurite instances already running on the host.

services:
  postgres:
    image: postgres:17-alpine
    container_name: git-insights-postgres
    environment:
      POSTGRES_DB: gitinsights
      POSTGRES_USER: gitinsights
      POSTGRES_PASSWORD: localdev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitinsights -d gitinsights"]
      interval: 5s
      timeout: 5s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: git-insights-azurite
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --skipApiVersionCheck
      --location /data
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  azurite-data:
